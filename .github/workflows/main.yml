name: Laptop Browser GUI Test

on:
  workflow_dispatch:

jobs:
  test_gui_job:
    runs-on: [self-hosted, gui-runner]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Open Google Chrome Live
        run: |
          echo "Opening Chrome browser on your laptop interface..."
          powershell -Command "Start-Process chrome.exe 'https://github.com'"
          Start-Sleep -Seconds 10
